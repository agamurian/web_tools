<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local converter</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><p class="eyebrow">WEB TOOLS / LOCAL CONVERTER</p><h1>A new format.<br>The same good stuff.</h1><p>Convert a video or picture. Your file stays on this machine.</p>
<form id="converter"><label id="drop" tabindex="0">Drop one file here <span>or click to browse · up to 512 MiB</span><input id="file" type="file" accept="video/*,image/*" required></label><p id="filename" aria-live="polite">No file selected</p><div class="options"><label>Convert to<select id="format" required></select></label><label>Quality<select id="quality"></select></label><label>Width<select id="width"></select></label></div><label class="check"><input type="checkbox" id="mute"> Remove audio</label><button id="submit" disabled>Convert & download</button><p id="status" role="status"></p><p class="note">Image exports use the first frame. GIF exports are animated at 12 fps. Transparency depends on the output format.</p></form></main><script src="/static/app.js"></script></body></html>
